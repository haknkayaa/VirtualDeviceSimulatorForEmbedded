version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/vds-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      web-dependencies:
        patterns:
          - "*"
    # typescript-eslint peers on typescript <6.1, so a TypeScript 7 bump makes the
    # whole group uninstallable (npm ci ERESOLVE). Re-enable once it supports 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-dependencies:
        patterns:
          - "*"
    # CodeQL is manual-only while code scanning is unavailable on this private repo.
    ignore:
      - dependency-name: github/codeql-action
