name: Build and Test

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Validate example configuration
        run: cargo run --locked -p vds-server -- --config config/vds-server.yaml --check-config

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vds-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vds-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  native-and-examples:
    name: Native adapters and C examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config build-essential libfuse3-dev
      - name: Build and test adapters
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -eu
          for variant in default asan-ubsan; do
            case "$variant" in
              default) flags="" ;;
              asan-ubsan) flags="-fsanitize=address,undefined -fno-omit-frame-pointer -g" ;;
            esac
            for adapter in spi-cuse i2c-cuse gpio-sim uart-pty; do
              echo "::group::$variant / $adapter"
              build_dir="$RUNNER_TEMP/build-$variant-$adapter"
              cmake -S "adapters/$adapter" -B "$build_dir" \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="$flags" \
                -DCMAKE_EXE_LINKER_FLAGS="$flags"
              cmake --build "$build_dir" --parallel
              ctest --test-dir "$build_dir" --output-on-failure
              echo "::endgroup::"
            done
          done
      - name: Build example applications
        run: |
          set -eu
          make -C examples/atmel-at24c256-embedded
          make -C examples/micron-mt25ql256-embedded
          # generic-uart-embedded has no Makefile; compile it directly.
          gcc -O2 -Wall -Wextra -Wpedantic -std=c11 -D_DEFAULT_SOURCE \
            examples/generic-uart-embedded/uart_ping.c \
            -o "$RUNNER_TEMP/uart_ping"

  # TODO: privileged real-device integration job (intentionally disabled).
  # Intended chain, using unmodified upstream Linux tools:
  #   vds-server (control API + Unix-socket data plane)
  #     -> host adapter (vds4e-spi-cuse / vds4e-i2c-cuse / vds4e-gpio-sim)
  #     -> /dev/spidevX.Y, /dev/i2c-N, /dev/gpiochipN
  #     -> spidev_test, i2ctransfer, gpioget
  # Requires /dev/cuse, FUSE, gpio-sim configfs and root; run on a
  # self-hosted privileged runner once available, then remove `if: false`.
  integration:
    name: Device ABI integration (disabled)
    if: false
    runs-on: ubuntu-latest
    needs: [rust, native-and-examples]
    steps:
      - run: echo "TODO - see comment above"
