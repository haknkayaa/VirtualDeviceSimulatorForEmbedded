name: CodeQL

# Automatic CodeQL runs are intentionally disabled while this private repository
# does not have GitHub code scanning enabled. Keeping it on push/PR/schedule only
# burns Actions minutes and fails when SARIF upload is rejected.
# Enable code scanning first, then restore the automatic triggers below.
on:
  workflow_dispatch:

# CodeQL does not support Rust by default; Rust is covered by clippy in CI.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
