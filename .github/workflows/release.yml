name: Release Debian package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/release-version"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debian-amd64:
    name: Debian amd64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vds-web/package-lock.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libfuse3-dev dpkg-dev curl

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = / {print $2; exit}' Cargo.toml)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            version="${release_tag#v}"
            if [[ -z "$version" || "$version" == "$release_tag" ]]; then
              echo "Release tag must have the form vX.Y.Z" >&2
              exit 1
            fi
          else
            version="$(tr -d '[:space:]' < .github/release-version)"
            release_tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
              echo "Release tag $release_tag already exists" >&2
              exit 1
            fi
          fi
          if [[ "$version" != "$workspace_version" ]]; then
            echo "Release version $version does not match workspace version $workspace_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: ./configure

      - name: Build
        run: ./build.sh

      - name: Build Debian package
        run: ./packaging/debian/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Inspect package
        run: |
          set -euo pipefail
          package="dist/vds4e_${{ steps.version.outputs.version }}_amd64.deb"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          sha256sum --check "$package.sha256"

      - name: Smoke install package
        run: |
          set -euo pipefail
          sudo apt-get install -y "./dist/vds4e_${{ steps.version.outputs.version }}_amd64.deb"
          command -v vds4e
          command -v vds-server
          command -v vds-cli
          test -x /usr/bin/vds4e-spi-cuse
          test -x /usr/bin/vds4e-i2c-cuse
          test -x /usr/bin/vds4e-gpio-sim
          test -x /usr/bin/vds4e-uart-pty
          test -f /etc/vds4e/vds-server.yaml
          test -f /usr/share/vds4e/web/index.html
          test -f /lib/systemd/system/vds4e.service
          vds4e --help >/dev/null
          vds-server --help >/dev/null
          vds-cli --help >/dev/null

          VDS4E_WEB_ROOT=/usr/share/vds4e/web \
            vds-server --config /etc/vds4e/vds-server.yaml \
            >"$RUNNER_TEMP/vds-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/vds-server.log"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/devices | grep -q '<div id="root">'
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Create release tag
        if: github.ref_type != 'tag'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          package="dist/vds4e_${{ steps.version.outputs.version }}_amd64.deb"
          checksum="$package.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$package" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$package" "$checksum" \
              --title "VDS4E $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
