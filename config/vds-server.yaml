schema_version: 1

server:
  control_address: 127.0.0.1:8080

data_plane:
  unix_socket: /tmp/vds4e.sock

observability:
  log_level: info

event_store:
  enabled: true
  max_size_mb: 1024
  max_events: 1000000
  cleanup_interval_seconds: 60
  transaction_retention_hours: 24
  register_read_retention_hours: 1
  critical_retention_days: 30
  register_read_sample_rate: 100

device_packages:
  # Repository examples are installed into ~/vsd4e/devices/ before loading.
  - device-models/examples/generic-spidev
  - device-models/examples/micron-mt25ql256aba8esf-0sit
  - device-models/examples/generic-gpio-bank
  - device-models/examples/generic-i2c-register
