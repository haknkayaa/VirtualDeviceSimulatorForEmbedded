<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f12" />
    <meta
      name="description"
      content="VDS4E virtual device workbench: Linux device nodes, adapters, device runtimes and bus analysis"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0f12'/%3E%3Cpath d='M7 9l5 14 5-14' fill='none' stroke='%23cfd6df' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23' cy='16' r='4' fill='none' stroke='%233d8ef0' stroke-width='2.6'/%3E%3C/svg%3E"
    />
    <title>VDS4E Workbench</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var theme = localStorage.getItem('vds4e-theme')
        if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
