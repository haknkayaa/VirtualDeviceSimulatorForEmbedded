syntax = "proto3";

package vds.v1;

// A request sent by an internal host adapter or native tool to the data plane.
message ClientRequest {
  uint64 request_id = 1;

  oneof payload {
    SpiTransferRequest spi_transfer = 10;
    GpioExchangeRequest gpio_exchange = 11;
    I2cTransferRequest i2c_transfer = 12;
  }
}

message GpioExchangeRequest {
  string device_id = 1;
  repeated bool host_values = 2;
}

message I2cTransferRequest {
  string device_id = 1;
  uint32 address = 2;
  repeated I2cMessage messages = 3;
}

message I2cMessage {
  bool read = 1;
  bytes data = 2;
  uint32 read_length = 3;
  uint32 flags = 4;
}

message SpiTransferRequest {
  string device_id = 1;
  bytes tx = 2;
  SpiWireConfig wire = 3;
  uint32 rx_length = 4;
}

// Physical SPI transaction attributes. Data-plane clients must provide this
// message and explicitly select lane widths and transfer rate.
message SpiWireConfig {
  uint32 mode = 1;
  uint32 bits_per_word = 2;
  uint64 max_speed_hz = 3;
  SpiLaneWidth command_width = 4;
  SpiLaneWidth address_width = 5;
  SpiLaneWidth data_width = 6;
  SpiTransferRate rate = 7;
  uint32 dummy_cycles = 8;
  bool lsb_first = 9;
}

enum SpiLaneWidth {
  SPI_LANE_WIDTH_UNSPECIFIED = 0;
  SPI_LANE_WIDTH_SINGLE = 1;
  SPI_LANE_WIDTH_DUAL = 2;
  SPI_LANE_WIDTH_QUAD = 4;
}

enum SpiTransferRate {
  SPI_TRANSFER_RATE_UNSPECIFIED = 0;
  SPI_TRANSFER_RATE_STR = 1;
  SPI_TRANSFER_RATE_DTR = 2;
}

// A response correlated with ClientRequest.request_id.
message ServerResponse {
  uint64 request_id = 1;

  oneof result {
    SpiTransferResponse spi_transfer = 10;
    ErrorResponse error = 11;
    GpioExchangeResponse gpio_exchange = 12;
    I2cTransferResponse i2c_transfer = 13;
  }
}

message GpioExchangeResponse {
  repeated bool device_values = 1;
}

message I2cTransferResponse {
  repeated bytes reads = 1;
}

message SpiTransferResponse {
  bytes rx = 1;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_DEVICE_NOT_FOUND = 1;
  ERROR_CODE_UNKNOWN_OPCODE = 2;
  ERROR_CODE_INVALID_REQUEST = 3;
  ERROR_CODE_INTERNAL = 4;
  ERROR_CODE_REGISTER_UNKNOWN_ADDRESS = 5;
  ERROR_CODE_REGISTER_READ_NOT_ALLOWED = 6;
  ERROR_CODE_REGISTER_WRITE_NOT_ALLOWED = 7;
  ERROR_CODE_REGISTER_VALUE_OVERFLOW = 8;
  ERROR_CODE_DEVICE_BUSY = 9;
  ERROR_CODE_TIMING_ERROR = 10;
  ERROR_CODE_STATE_INVALID_EVENT = 11;
  ERROR_CODE_STATE_GUARD_REJECTED = 12;
  ERROR_CODE_STATE_COMMAND_REJECTED = 13;
  ERROR_CODE_STATE_ACTION_FAILED = 14;
  ERROR_CODE_FAULT_TIMEOUT = 15;
  ERROR_CODE_FAULT_RETURN_ERROR = 16;
  ERROR_CODE_FAULT_DROPPED = 17;
  ERROR_CODE_FAULT_ACTION_FAILED = 18;
}
