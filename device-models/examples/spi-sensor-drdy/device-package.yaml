api_version: vds4e.dev/v1alpha1
kind: DevicePackage

metadata:
  id: spi-sensor-drdy
  display_name: SPI Sensor with DRDY Output
  version: 1.0.0
  description: Example SPI sensor that publishes a data-ready signal for board topology wiring.
  license: Apache-2.0
  authors: [VDS4E Contributors]
  tags: [spi, sensor, drdy, topology, example]

spec:
  bus:
    type: spi
    profile: spi.mode0
    options:
      mode: 0
      transfer_bits: 8
      max_frequency_hz: 10000000
  runtime:
    driver: generic-spi-command
    model: model/device.yaml
  documentation: docs
  extensions:
    purpose: cross-device-signal-example
