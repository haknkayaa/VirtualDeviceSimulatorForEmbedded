schema_version: 1
scenario: { id: mt25ql256-four-byte-page-program, name: MT25QL256 four-byte page program, timeout_ms: 20 }
steps:
  - { id: complete_reset, action: advance_time, duration_ms: 1 }
  - { id: write_enable, action: send_spi, device: micron-mt25ql256aba8esf-0sit, tx: "06", save_as: enabled }
  - { id: program, action: send_spi, device: micron-mt25ql256aba8esf-0sit, tx: "12 01 00 00 10 A5 5A", save_as: programmed }
  - { id: complete_program, action: advance_time, duration_ms: 1 }
  - { id: read, action: send_spi, device: micron-mt25ql256aba8esf-0sit, tx: "13 01 00 00 10 00 00", save_as: data }
  - { id: assert_data, action: assert_response, source: data, expected: "A5 5A" }
  - { id: assert_wel_cleared, action: assert_register, device: micron-mt25ql256aba8esf-0sit, register: STATUS_REGISTER, expected: 0 }
