schema_version: 1

device:
  id: spi-flash-0
  name: Example Generic SPI Flash
  bus: spi
  model: generic-spi-command
  commands:
    - name: READ_ID
      opcode: 0x9F
      response: [0xEF, 0x40, 0x18]
    - name: READ_REGISTER
      opcode: 0x03
      operation: register_read
      address_bytes: 1
    - name: WRITE_REGISTER
      opcode: 0x02
      operation: register_write
      address_bytes: 1
      allowed_states: [ready]
      timing:
        latency_us: 10000
        busy_during_operation: true
  busy:
    register_address: 0x00
    mask: 0x01
  state_machine:
    initial_state: resetting
    states:
      resetting:
        entry_actions:
          - set_register:
              name: STATUS
              mask: 0x01
              value: 0x01
        transitions:
          - event: reset_complete
            target: ready
        delayed_events:
          - event: reset_complete
            delay_us: 5000
      ready:
        entry_actions:
          - set_register:
              name: STATUS
              mask: 0x01
              value: 0x00
        transitions:
          - event: write_started
            target: busy
            guard:
              register:
                name: STATUS
                mask: 0x01
                equals: 0x00
      busy:
        entry_actions:
          - set_register:
              name: STATUS
              mask: 0x01
              value: 0x01
        exit_actions:
          - set_register:
              name: STATUS
              mask: 0x01
              value: 0x00
        transitions:
          - event: operation_completed
            target: ready
  registers:
    - name: STATUS
      address: 0x00
      width_bits: 8
      reset_value: 0x00
      access: ro
    - name: CONTROL
      address: 0x01
      width_bits: 8
      reset_value: 0x12
      access: rw
    - name: COMMAND
      address: 0x03
      width_bits: 8
      reset_value: 0x00
      access: wo
