api_version: vds4e.dev/v1alpha1
kind: DevicePackage

metadata:
  id: generic-spi-flash-128m
  display_name: Generic SPI Flash 128 Mbit
  version: 1.0.0
  description: Vendor-neutral SPI NOR flash reference package.
  license: Apache-2.0
  authors: [VDS4E Contributors]
  tags: [spi, flash, memory, reference]

spec:
  bus:
    type: spi
    profile: spi.mode0
    options:
      mode: 0
      transfer_bits: 8
      max_frequency_hz: 50000000
  runtime:
    driver: generic-spi-command
    model: model/device.yaml
  authoring:
    behavior_flow: flows/behavior.yaml
  validation:
    scenarios: scenarios
    fixtures: fixtures
  documentation: docs
  assets: assets
  extensions: {}
