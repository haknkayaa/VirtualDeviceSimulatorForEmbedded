schema_version: 1
scenario: { id: generic-flash-write-enable, name: Write enable lifecycle, timeout_ms: 100 }
steps:
  - { id: settle_reset, action: advance_time, duration_ms: 5 }
  - { id: enable, action: send_spi, device: generic-spi-flash-128m, tx: "06", save_as: enabled }
  - { id: assert_enabled_state, action: assert_state, device: generic-spi-flash-128m, expected: write_enabled }
  - { id: assert_wel, action: assert_register, device: generic-spi-flash-128m, register: STATUS1, expected: 2 }
  - { id: disable, action: send_spi, device: generic-spi-flash-128m, tx: "04", save_as: disabled }
  - { id: assert_ready, action: assert_state, device: generic-spi-flash-128m, expected: ready }
