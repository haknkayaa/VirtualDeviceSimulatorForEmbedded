schema_version: 1
scenario: { id: generic-flash-page-program, name: Page program success, timeout_ms: 100 }
steps:
  - { id: settle_reset, action: advance_time, duration_ms: 5 }
  - { id: enable, action: send_spi, device: generic-spi-flash-128m, tx: "06", save_as: enabled }
  - { id: program, action: send_spi, device: generic-spi-flash-128m, tx: "02 00 00 10 AA 55", save_as: programmed }
  - { id: advance_program, action: advance_time, duration_ms: 10 }
  - { id: read, action: send_spi, device: generic-spi-flash-128m, tx: "03 00 00 10 00 00", save_as: data }
  - { id: assert_data, action: assert_response, source: data, expected: "AA 55" }
  - { id: assert_wel_cleared, action: assert_register, device: generic-spi-flash-128m, register: STATUS1, expected: 0 }
