schema_version: 1
scenario: { id: generic-flash-sector-erase, name: Sector erase success, timeout_ms: 500 }
steps:
  - { id: settle_reset, action: advance_time, duration_ms: 5 }
  - { id: enable_program, action: send_spi, device: generic-spi-flash-128m, tx: "06", save_as: enabled_program }
  - { id: program, action: send_spi, device: generic-spi-flash-128m, tx: "02 00 01 00 00", save_as: programmed }
  - { id: complete_program, action: advance_time, duration_ms: 10 }
  - { id: enable_erase, action: send_spi, device: generic-spi-flash-128m, tx: "06", save_as: enabled_erase }
  - { id: erase, action: send_spi, device: generic-spi-flash-128m, tx: "20 00 01 00", save_as: erased }
  - { id: complete_erase, action: advance_time, duration_ms: 150 }
  - { id: read, action: send_spi, device: generic-spi-flash-128m, tx: "03 00 01 00 00", save_as: data }
  - { id: assert_erased, action: assert_response, source: data, expected: "FF" }
