schema_version: 1
scenario: { id: generic-flash-timeout-fault, name: Page program timeout fault, timeout_ms: 100 }
steps:
  - { id: settle_reset, action: advance_time, duration_ms: 5 }
  - { id: enable_write, action: send_spi, device: generic-spi-flash-128m, tx: "06", save_as: enabled }
  - { id: enable_fault, action: enable_fault, fault: page_program_timeout }
  - { id: program, action: send_spi, device: generic-spi-flash-128m, tx: "02 00 04 00 AA", save_as: timed_out }
  - { id: assert_timeout, action: assert_error, source: timed_out, expected_code: fault_timeout }
  - { id: disable_fault, action: disable_fault, fault: page_program_timeout }
