schema_version: 1
scenario: { id: generic-flash-busy-timing, name: Busy timing validation, timeout_ms: 100 }
steps:
  - { id: settle_reset, action: advance_time, duration_ms: 5 }
  - { id: enable, action: send_spi, device: generic-spi-flash-128m, tx: "06", save_as: enabled }
  - { id: program, action: send_spi, device: generic-spi-flash-128m, tx: "02 00 02 00 A5", save_as: programmed }
  - { id: assert_programming, action: assert_state, device: generic-spi-flash-128m, expected: programming }
  - { id: assert_busy, action: assert_register, device: generic-spi-flash-128m, register: STATUS1, expected: 1 }
  - { id: complete, action: advance_time, duration_ms: 10 }
  - { id: assert_ready, action: assert_state, device: generic-spi-flash-128m, expected: ready }
