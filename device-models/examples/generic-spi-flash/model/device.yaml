# Runtime model declared by ../device-package.yaml.
schema_version: 1

device:
  id: generic-spi-flash-128m
  name: Generic SPI Flash 128 Mbit
  bus: spi
  model: generic-spi-command
  spi: { mode: 0, transfer_bits: 8 }

  memory:
    size_bytes: 16777216
    page_size_bytes: 256
    sector_size_bytes: 4096
    erased_value: 0xFF

  commands:
    - { name: READ_ID, opcode: 0x9F, response: [0x00, 0x40, 0x18], allowed_states: [resetting, ready, write_enabled] }
    - { name: READ_STATUS, opcode: 0x05, operation: register_read, register: STATUS1, allowed_states: [resetting, ready, write_enabled, programming, erasing] }
    - { name: WRITE_ENABLE, opcode: 0x06, response: [], event: write_enable, allowed_states: [ready] }
    - { name: WRITE_DISABLE, opcode: 0x04, response: [], event: write_disable, allowed_states: [write_enabled] }
    - { name: READ_DATA, opcode: 0x03, operation: memory_read, address_bytes: 3, allowed_states: [ready, write_enabled] }
    - name: PAGE_PROGRAM
      opcode: 0x02
      operation: page_program
      address_bytes: 3
      event: page_program
      allowed_states: [write_enabled]
      timing: { latency_us: 10000, busy_during_operation: true }
    - name: SECTOR_ERASE
      opcode: 0x20
      operation: sector_erase
      address_bytes: 3
      event: sector_erase
      allowed_states: [write_enabled]
      timing: { latency_us: 150000, busy_during_operation: true }
    - name: CHIP_ERASE
      opcode: 0xC7
      operation: chip_erase
      event: sector_erase
      allowed_states: [write_enabled]
      timing: { latency_us: 150000, busy_during_operation: true }
    - { name: DEEP_POWER_DOWN, opcode: 0xB9, response: [], event: deep_power_down, allowed_states: [ready] }
    - { name: RELEASE_POWER_DOWN, opcode: 0xAB, response: [], event: release_power_down, event_delay_us: 30, allowed_states: [deep_power_down] }
    - { name: RESET_ENABLE, opcode: 0x66, response: [], allowed_states: [resetting, ready, write_enabled, programming, erasing, deep_power_down, error] }
    - { name: RESET, opcode: 0x99, response: [], event: reset, allowed_states: [resetting, ready, write_enabled, programming, erasing, deep_power_down, error] }

  busy: { register_address: 0x00, mask: 0x01 }

  registers:
    - { name: STATUS1, address: 0x00, width_bits: 8, reset_value: 0x00, access: ro }
    - { name: STATUS2, address: 0x01, width_bits: 8, reset_value: 0x00, access: ro }
    - { name: CONFIG, address: 0x02, width_bits: 8, reset_value: 0x08, access: rw }

  state_machine:
    initial_state: resetting
    states:
      powered_off:
        transitions:
          - { event: power_on, target: resetting }
      resetting:
        entry_actions:
          - { set_register: { name: STATUS1, value: 0x01, mask: 0x03 } }
        transitions:
          - { event: reset_complete, target: ready }
          - { event: reset, target: resetting }
        delayed_events:
          - { event: reset_complete, delay_us: 5000 }
      ready:
        entry_actions:
          - { set_register: { name: STATUS1, value: 0x00, mask: 0x03 } }
        transitions:
          - { event: write_enable, target: write_enabled }
          - { event: deep_power_down, target: deep_power_down }
          - { event: reset, target: resetting }
      write_enabled:
        entry_actions:
          - { set_register: { name: STATUS1, value: 0x02, mask: 0x03 } }
        exit_actions:
          - { set_register: { name: STATUS1, value: 0x00, mask: 0x02 } }
        transitions:
          - { event: write_disable, target: ready }
          - { event: page_program, target: programming }
          - { event: sector_erase, target: erasing }
          - { event: reset, target: resetting }
      programming:
        entry_actions:
          - { set_register: { name: STATUS1, value: 0x01, mask: 0x03 } }
        transitions:
          - { event: operation_completed, target: ready }
          - { event: reset, target: resetting }
      erasing:
        entry_actions:
          - { set_register: { name: STATUS1, value: 0x01, mask: 0x03 } }
        transitions:
          - { event: operation_completed, target: ready }
          - { event: reset, target: resetting }
      deep_power_down:
        entry_actions:
          - { set_register: { name: STATUS1, value: 0x00, mask: 0x03 } }
        transitions:
          - { event: release_power_down, target: ready }
          - { event: reset, target: resetting }
      error:
        entry_actions:
          - { set_register: { name: STATUS1, value: 0x01, mask: 0x01 } }
        transitions:
          - { event: reset, target: resetting }

  faults:
    - { id: page_program_timeout, enabled: false, priority: 100, target: { command: PAGE_PROGRAM }, trigger: always, action: { type: timeout, duration_ms: 500 } }
    - { id: sector_erase_timeout, enabled: false, priority: 100, target: { command: SECTOR_ERASE }, trigger: always, action: { type: timeout, duration_ms: 1000 } }
    - { id: busy_stuck_at_1, enabled: false, persistent: true, target: { command: READ_STATUS, register: STATUS1 }, trigger: always, action: { type: stuck_at, value: 0x01, mask: 0x01 } }
    - { id: wel_forced_low, enabled: false, target: { command: READ_STATUS, register: STATUS1 }, trigger: always, action: { type: stuck_at, value: 0x00, mask: 0x02 } }
    - { id: read_data_corruption, enabled: false, target: { command: READ_DATA }, trigger: always, action: { type: corrupt_response, xor_mask: 0x01 } }
    - { id: power_loss_during_program, enabled: false, priority: 90, target: { command: PAGE_PROGRAM }, trigger: always, action: { type: return_error, code: power_loss, message: simulated power loss before commit } }
