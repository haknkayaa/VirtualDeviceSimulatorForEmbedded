schema_version: 1

device:
  id: generic-spidev
  name: Generic SPI Device
  bus: spi
  model: generic-spi-command
  spi:
    mode: 0
    transfer_bits: 8
    max_frequency_hz: 10000000

  commands:
    - name: PING
      opcode: 0xA0
      response: [0xDE, 0xAD, 0xBE, 0xEF]
      shortcut:
        tx: [0xA0]
        rx_length: 4
        description: Verify that the SPI endpoint responds.

    - name: TX_ONLY
      opcode: 0xA1
      response: []
      shortcut:
        tx: [0xA1, 0x11, 0x22, 0x33, 0x44]
        rx_length: 0
        description: Send a known payload without requesting response bytes.

    - name: FULL_DUPLEX_TEST
      opcode: 0xA2
      response: [0xA5, 0x5A, 0xC3, 0x3C]
      shortcut:
        tx: [0xA2, 0x10, 0x20, 0x30, 0x40]
        rx_length: 4
        description: Exercise TX and RX phases in one transfer.

    - name: RX_PATTERN_8
      opcode: 0xA3
      response: [0x00, 0xFF, 0x55, 0xAA, 0x12, 0x34, 0x56, 0x78]
      shortcut:
        tx: [0xA3]
        rx_length: 8
        description: Read an eight-byte deterministic test pattern.

  registers: []
  faults: []
