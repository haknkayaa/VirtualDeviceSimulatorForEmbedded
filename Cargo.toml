[workspace]
members = [
    "apps/vds-cli",
    "apps/vds-server",
    "crates/vds-core",
    "crates/vds-device-model",
    "crates/vds-events",
    "crates/vds-protocol",
    "crates/vds-registers",
    "crates/vds-scenario",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/vds4e/virtual-device-simulator"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.31"
jsonschema = { version = "0.33.0", default-features = false }
prost = "0.13.5"
prost-build = "0.13.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
