schema_version: 1

scenario:
  id: delayed_write_with_timeout
  name: Delayed Write With Timeout
  timeout_ms: 1000

steps:
  - id: reset
    action: reset_device
    device: spi-flash-0

  - id: complete_reset
    action: advance_time
    duration_ms: 5

  - id: check_ready
    action: assert_state
    device: spi-flash-0
    expected: ready

  - id: enable_timeout
    action: enable_fault
    fault: read_id_timeout

  - id: read_id
    action: send_spi
    device: spi-flash-0
    tx: "9F"
    save_as: read_id_result

  - id: assert_timeout
    action: assert_error
    source: read_id_result
    expected_code: fault_timeout

  - id: disable_timeout
    action: disable_fault
    fault: read_id_timeout
